name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            archive: tar.gz
            bin: nosco
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            archive: tar.gz
            bin: nosco
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
            bin: nosco
          - target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
            bin: nosco
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            bin: nosco.exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip
            bin: nosco.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build nosco-cli
        run: cargo build --release --locked -p nosco-cli --target ${{ matrix.target }}

      - name: Ad-hoc codesign macOS binary
        if: runner.os == 'macOS'
        run: codesign --force --sign - "target/${{ matrix.target }}/release/nosco"

      - name: Package tar.gz archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          pkg="nosco-${{ matrix.target }}"
          mkdir -p "stage/${pkg}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "stage/${pkg}/"
          chmod +x "stage/${pkg}/${{ matrix.bin }}"
          cp LICENSE NOTICE README.md "stage/${pkg}/"
          mkdir -p dist
          tar -C stage -czf "dist/${pkg}.tar.gz" "${pkg}"

      - name: Package zip archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = "nosco-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "stage/$pkg", "dist" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "stage/$pkg/"
          Copy-Item LICENSE, NOTICE, README.md "stage/$pkg/"
          Compress-Archive -Path "stage/$pkg" -DestinationPath "dist/$pkg.zip"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  models:
    name: Build compacted GROBID 0.9.1 models
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux x86_64 nosco binary
        uses: actions/download-artifact@v4
        with:
          name: binary-x86_64-unknown-linux-musl
          path: bin-dist

      - name: Extract nosco binary
        run: |
          set -euo pipefail
          tar -xzf bin-dist/nosco-x86_64-unknown-linux-musl.tar.gz -C bin-dist
          ./bin-dist/nosco-x86_64-unknown-linux-musl/nosco --version

      - name: Download GROBID 0.9.1 grobid-home and compact models
        run: |
          set -euo pipefail
          curl -fLsS https://github.com/grobidOrg/grobid/archive/refs/tags/0.9.1.tar.gz -o grobid-0.9.1.tar.gz
          tar -xzf grobid-0.9.1.tar.gz grobid-0.9.1/grobid-home
          pack="nosco-models-grobid-0.9.1"
          mkdir -p "stage/${pack}" dist
          ./bin-dist/nosco-x86_64-unknown-linux-musl/nosco setup \
            --grobid-home grobid-0.9.1/grobid-home \
            --out "stage/${pack}"
          for slug in header segmentation name-header date affiliation-address name-citation citation reference-segmenter fulltext figure table; do
            test -f "stage/${pack}/${slug}.gcrf"
          done
          test -f "stage/${pack}/lexicon.glex"
          cp LICENSE NOTICE "stage/${pack}/"
          tar -C stage -czf "dist/${pack}.tar.gz" "${pack}"
          ls -lh "dist/${pack}.tar.gz"

      - name: Upload models artifact
        uses: actions/upload-artifact@v4
        with:
          name: models-grobid-0.9.1
          path: dist/nosco-models-grobid-0.9.1.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, models]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd artifacts
          LC_ALL=C sha256sum nosco-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "${{ github.repository }}" artifacts/* --clobber
          else
            gh release create "$TAG" --repo "${{ github.repository }}" artifacts/* \
              --title "$TAG" \
              --generate-notes
          fi
